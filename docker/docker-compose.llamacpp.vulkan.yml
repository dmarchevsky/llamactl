version: '3.8'

services:
  llamactl-llamacpp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.llamacpp
    image: llamactl:llamacpp-vulkan
    container_name: llamactl-llamacpp
    ports:
      - "8888:8080"
    volumes:
      - ./data/llamacpp:/data
      - ${MODELS_DIR}:/models  # Mount models directory
      - ~/.cache/llama.cpp:/root/.cache/llama.cpp  # Llama.cpp cache
    environment:
      # Set data directory for persistence
      - LLAMACTL_DATA_DIR=/data
      # Enable Docker mode for nested containers
      - LLAMACTL_LLAMACPP_DOCKER_ENABLED=true
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - video
    restart: unless-stopped